# Local development stack. Start with:
#   npx supabase start -x studio,logflare,vector,imgproxy,supavisor,realtime,storage-api,edge-runtime,postgres-meta
project_id = "cartfull"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["../db/seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

# Mailpit: every auth email sent locally lands at http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Raised so the end-to-end suite can sign up several users in a row.
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Cartfull sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your Cartfull account"
content_path = "./supabase/templates/magic_link.html"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
