<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#FAF7F2;font-family:Arial,Helvetica,sans-serif;color:#1C1B1A;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="padding:32px;background:#FFFFFF;border-radius:16px;">
          <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#2D6A4F;">Cartfull</p>
          <p style="margin:0 0 8px;font-size:20px;line-height:28px;">Your sign-in link</p>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#57534E;">
            Tap the button to sign in. The link works once and expires in an hour.
          </p>
          <p style="margin:0 0 24px;">
            <a
              href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email&email={{ .Email }}"
              style="display:inline-block;padding:14px 24px;background:#2D6A4F;color:#FFFFFF;text-decoration:none;border-radius:999px;font-size:16px;font-weight:bold;"
              >Sign in to Cartfull</a
            >
          </p>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#57534E;">
            Or type this code on the sign-in screen:
            <strong style="color:#1C1B1A;letter-spacing:3px;">{{ .Token }}</strong>
          </p>
          <p style="margin:0;font-size:14px;line-height:20px;color:#78716C;">
            Didn't ask for this? You can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
